<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Skyddsnät: kundsajten är publik, så CSP:n låser ner vad sidan får
      göra. connect-src: API:ts origin (sätts vid bygget) och 'self'
      för dev-proxyn. img-src: https (restaurangernas egna logotyper och
      bilder ligger på deras egna adresser). Inga externa skript, och
      typsnitten ligger i bygget - inga anrop till Google.
      frame-ancestors kan inte sättas i en meta-tagg - sätt den som riktigt
      svarshuvud i CloudFronts response headers policy.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; connect-src 'self' %API_ORIGIN%; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self' mailto:"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Restaurang</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
